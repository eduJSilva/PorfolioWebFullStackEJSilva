##############################################################################
# Portfolio Eduardo J. Silva - API
# Todos los valores sensibles se leen de variables de entorno.
# Ver .env.example en la raíz del back-end. NUNCA commitear credenciales.
##############################################################################
spring.application.name=portfolio-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework

## Base de datos (MySQL en producción)
spring.datasource.url=${DB_URL:jdbc:h2:mem:portfolio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Las entidades se serializan directamente (colecciones lazy), por eso se mantiene open-in-view
spring.jpa.open-in-view=true
# Mantiene la tabla única "hibernate_sequence" que usa la base de datos existente
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=legacy

## JWT
app.jwt.header=Authorization
app.jwt.header.prefix=Bearer 
app.jwt.secret=${APP_JWT_SECRET:cambiar-este-secreto-en-produccion}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}

## Tokens
app.token.email.verification.duration=3600000
app.token.password.reset.duration=3600000
app.token.refresh.duration=2592000000
app.velocity.templates.location=/templates/

## Cache de tokens deslogueados
app.cache.logoutToken.maxSize=1000

## Front-end (CORS + links de los emails)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://silvaeduardojavierporfolio.vercel.app,https://porfolioeduardojsilva.web.app}

## Administrador: el usuario con este email recibe el rol ADMIN al arrancar (vacío = no hace nada)
app.admin.email=${APP_ADMIN_EMAIL:}

## Cloudinary
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

## Mail (Gmail con "contraseña de aplicación")
spring.mail.default-encoding=UTF-8
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

## OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

## Jackson 3: mantener el comportamiento de Jackson 2 (campos numéricos omitidos/nulos => 0)
spring.jackson.deserialization.fail-on-null-for-primitives=false
