# Perfil de desarrollo: H2 en memoria con datos de ejemplo.
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:mem:portfolio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql
spring.sql.init.encoding=UTF-8

# Usuario administrador local (solo perfil dev)
app.dev.admin.email=admin@portfolio.local
app.dev.admin.password=admin12345
